type: object
description: A public-facing user record (never includes the password hash).
required:
  - id
  - name
  - email
  - role
properties:
  id:
    type: string
    description: User id, stringified numeric primary key.
    example: "1"
  name:
    type: string
    example: Ada Lovelace
  email:
    type: string
    format: email
    example: ada@example.com
  role:
    type: string
    enum:
      - member
      - admin
    example: member
