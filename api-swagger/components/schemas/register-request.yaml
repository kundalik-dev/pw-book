type: object
required:
  - name
  - email
  - password
properties:
  name:
    type: string
    minLength: 1
    maxLength: 200
    example: Ada Lovelace
  email:
    type: string
    format: email
    example: ada@example.com
  password:
    type: string
    format: password
    minLength: 8
    example: Sup3rSecret!
